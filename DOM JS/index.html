<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perpus Mini - Contoh DOM</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f1f5f9;
        color: #1e293b;
        padding: 24px;
      }
      .wrap {
        max-width: 600px;
        margin: 0 auto;
      }
      h1 {
        font-size: 22px;
        margin-bottom: 4px;
      }
      #status {
        color: #64748b;
        font-size: 13px;
        margin-bottom: 16px;
      }
      form,
      .cari {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      input,
      select {
        flex: 1 1 140px;
        padding: 8px 10px;
        border: 1.5px solid #cbd5e1;
        border-radius: 8px;
        background: #fff;
      }
      input.salah {
        border-color: #dc2626;
      } /* [8] input yang gagal validasi */
      label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
      }
      input[type="checkbox"] {
        flex: none;
      }
      button {
        padding: 7px 12px;
        border: 1.5px solid #93c5fd;
        border-radius: 8px;
        background: #fff;
        color: #2563eb;
        cursor: pointer;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #pesan {
        font-size: 13px;
        min-height: 18px;
        margin-bottom: 8px;
      }
      #detail {
        font-size: 13px;
        color: #475569;
        background: #e2e8f0;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 12px;
      }
      ul {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      li {
        background: #fff;
        border-radius: 10px;
        padding: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-left: 4px solid #2563eb;
        cursor: pointer;
      }
      li.dipilih {
        box-shadow: 0 0 0 3px #2563eb;
      }
      li.dipinjam {
        border-left-color: #f59e0b;
        background: #fffbeb;
      }
      .info {
        flex: 1;
        font-size: 14px;
      }
      .info small {
        display: block;
        color: #64748b;
      }
      .aksi {
        display: flex;
        gap: 6px;
      }
      .kosong {
        justify-content: center;
        color: #94a3b8;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>📚 Perpus Mini</h1>
      <p id="status">0 buku</p>

      <!-- [5][8] submit: atribut name dibutuhkan oleh FormData -->
      <form id="form-buku">
        <input name="judul" id="input-judul" placeholder="Judul buku" />
        <input name="penulis" id="input-penulis" placeholder="Penulis" />
        <label
          ><input type="checkbox" name="langsung" /> Langsung dipinjam</label
        >
        <button type="submit">Tambah</button>
      </form>
      <p id="pesan"></p>

      <!-- [5] input & change: cari + filter -->
      <div class="cari">
        <input id="input-cari" placeholder="Cari judul..." />
        <select id="filter-status">
          <option value="semua">Semua</option>
          <option value="tersedia">Tersedia</option>
          <option value="dipinjam">Dipinjam</option>
        </select>
      </div>

      <!-- [9] hasil traversal: sebelumnya / berikutnya -->
      <p id="detail"></p>

      <ul id="daftar-buku"></ul>
    </div>

    <script>
      /* ==========================================================
   CATATAN SINGKAT (tanda [1]-[10] mengikuti poin di README)
   [1] querySelector     -> ambil 1 elemen pertama (null jika tidak ada)
       querySelectorAll  -> ambil semua elemen (NodeList, pakai forEach)
   [2] textContent -> isi sebagai teks biasa (aman untuk input pengguna)
       innerHTML   -> isi sebagai HTML (hanya untuk HTML buatan sendiri)
       innerText   -> hanya teks yang terlihat (elemen display:none tidak ikut)
   [3] getAttribute / setAttribute / removeAttribute -> baca / ubah / hapus atribut
       style -> ubah CSS langsung | classList -> add / remove / toggle class
   [4] createElement -> buat elemen | append / prepend -> taruh di akhir / awal
       remove -> hapus elemen dari halaman
   [5] click -> diklik | input -> nilai berubah saat mengetik
       submit -> form dikirim (preventDefault = cegah reload)
   [6] Bubbling -> event naik dari anak ke parent
       stopPropagation -> hentikan naiknya event
   [7] Event delegation -> 1 listener di parent untuk banyak anak
       closest() = cari elemen terdekat | dataset = baca atribut data-*
   [8] Ambil data & validasi -> value selalu string, trim(), FormData,
       fungsi validasi mengembalikan pesan error (atau null jika valid)
   [9] Traversal -> parentElement, children, firstElementChild,
       lastElementChild, previousElementSibling, nextElementSibling
   [10] Render -> ubah DATA (array) dulu, lalu panggil renderBuku()
   ========================================================== */

      // [1] Pilih elemen: querySelector -> 1 elemen berdasarkan selector CSS
      const form = document.querySelector("#form-buku");
      const inputJudul = document.querySelector("#input-judul");
      const inputPenulis = document.querySelector("#input-penulis");
      const inputCari = document.querySelector("#input-cari");
      const filterStatus = document.querySelector("#filter-status");
      const pesan = document.querySelector("#pesan");
      const elStatus = document.querySelector("#status");
      const detail = document.querySelector("#detail");
      const daftar = document.querySelector("#daftar-buku");

      // [10] DATA = sumber kebenaran. Tampilan selalu digambar dari data ini.
      let daftarBuku = [
        {
          id: 1,
          judul: "Laskar Pelangi",
          penulis: "Andrea Hirata",
          dipinjam: false,
        },
        {
          id: 2,
          judul: "Bumi Manusia",
          penulis: "Pramoedya Ananta Toer",
          dipinjam: true,
        },
        {
          id: 3,
          judul: "Atomic Habits",
          penulis: "James Clear",
          dipinjam: false,
        },
      ];
      let idDipilih = null; // id buku yang sedang dipilih (null = tidak ada)

      // [4] Buat satu kartu buku dengan createElement (belum tampil sebelum dimasukkan ke DOM)
      function buatKartu(buku) {
        const li = document.createElement("li");
        li.dataset.id = buku.id; // [7] simpan id di data-id
        li.classList.toggle("dipinjam", buku.dipinjam); // [3] true -> tambah class, false -> hapus
        li.classList.toggle("dipilih", buku.id === idDipilih);

        const info = document.createElement("div");
        info.className = "info";
        const judul = document.createElement("strong");
        judul.textContent = buku.judul; // [2] textContent: teks biasa, aman
        const sub = document.createElement("small");
        sub.textContent = `${buku.penulis} · ${buku.dipinjam ? "Dipinjam" : "Tersedia"}`;
        info.append(judul, sub); // [4] append: boleh banyak elemen sekaligus

        // [10] Tombol aksi: data-aksi memberi tahu listener tombol ini untuk apa
        const pinjam = document.createElement("button");
        pinjam.textContent = buku.dipinjam ? "Kembalikan" : "Pinjam";
        pinjam.dataset.aksi = "pinjam";

        const hapus = document.createElement("button");
        hapus.textContent = "Hapus";
        hapus.dataset.aksi = "hapus";
        if (buku.dipinjam) {
          hapus.setAttribute("disabled", "true"); // [3] buku yang dipinjam tidak boleh dihapus
          hapus.setAttribute("title", "Kembalikan dulu sebelum menghapus");
        }

        const aksi = document.createElement("div");
        aksi.className = "aksi";
        aksi.append(pinjam, hapus);

        li.append(info, aksi);
        return li;
      }

      // [10] Gambar ulang daftar dari data (dipanggil setiap data / filter berubah)
      function renderBuku() {
        const kata = inputCari.value.trim().toLowerCase(); // [8] value + trim
        const status = filterStatus.value; // [8] value dari <select>

        const tampil = daftarBuku.filter((buku) => {
          const cocokJudul = buku.judul.toLowerCase().includes(kata);
          const cocokStatus =
            status === "semua" || (status === "dipinjam") === buku.dipinjam;
          return cocokJudul && cocokStatus;
        });

        daftar.innerHTML = ""; // kosongkan dulu
        if (tampil.length === 0) {
          // [2] innerHTML: HTML buatan sendiri, bukan dari input pengguna
          const teks =
            daftarBuku.length === 0
              ? "Belum ada buku."
              : "Tidak ada buku yang cocok.";
          daftar.innerHTML = `<li class="kosong"><em>${teks}</em></li>`;
        } else {
          tampil.forEach((buku) => daftar.append(buatKartu(buku)));
        }

        const jumlahDipinjam = daftarBuku.filter(
          (buku) => buku.dipinjam,
        ).length;
        elStatus.textContent = `${daftarBuku.length} buku · ${jumlahDipinjam} dipinjam`;
        perbaruiDetail();
      }

      // [9] Traversal: dari kartu terpilih, lihat saudara dan posisinya
      function perbaruiDetail() {
        const kartu = daftar.querySelector("li.dipilih"); // [1]
        if (!kartu) {
          detail.textContent = "Klik sebuah buku untuk melihat posisinya.";
          return;
        }
        const namaDari = (li) =>
          li ? li.querySelector("strong").textContent : "-";
        const urutan = [...daftar.children].indexOf(kartu) + 1; // children -> HTMLCollection, ubah ke array
        const posisi =
          kartu === daftar.firstElementChild
            ? " (pertama)"
            : kartu === daftar.lastElementChild
              ? " (terakhir)"
              : "";

        detail.textContent =
          `Dipilih: ${namaDari(kartu)} · urutan ${urutan} dari ${daftar.children.length}${posisi}` +
          ` · sebelumnya: ${namaDari(kartu.previousElementSibling)}` +
          ` · berikutnya: ${namaDari(kartu.nextElementSibling)}`;
      }

      // [8] Validasi: kembalikan { input, pesan } jika salah, atau null jika valid
      function validasiBuku(judul, penulis) {
        if (judul === "")
          return { input: inputJudul, pesan: "Judul wajib diisi." };
        if (judul.length < 3)
          return { input: inputJudul, pesan: "Judul minimal 3 karakter." };
        if (penulis === "")
          return { input: inputPenulis, pesan: "Penulis wajib diisi." };

        const sudahAda = daftarBuku.some(
          (buku) => buku.judul.toLowerCase() === judul.toLowerCase(),
        );
        if (sudahAda)
          return {
            input: inputJudul,
            pesan: "Buku dengan judul itu sudah ada.",
          };
        return null;
      }

      function tampilkanPesan(teks, warna) {
        pesan.textContent = teks;
        pesan.style.color = warna; // [3] style langsung (camelCase untuk properti CSS)
      }

      // [5] submit: dijalankan saat form dikirim
      form.addEventListener("submit", (event) => {
        event.preventDefault(); // cegah halaman reload

        // [8] FormData: ambil semua input ber-name sekaligus -> { judul, penulis, langsung? }
        const data = Object.fromEntries(new FormData(form));
        const judul = data.judul.trim(); // trim: buang spasi di awal & akhir
        const penulis = data.penulis.trim();
        const langsungPinjam = data.langsung === "on"; // checkbox hanya ada di FormData jika dicentang

        const error = validasiBuku(judul, penulis);
        if (error) {
          error.input.classList.add("salah"); // [3]
          error.input.focus();
          return tampilkanPesan(error.pesan, "#dc2626");
        }

        // [10] ubah DATA dulu, lalu render ulang
        daftarBuku.unshift({
          id: Date.now(),
          judul,
          penulis,
          dipinjam: langsungPinjam,
        });
        form.reset();
        tampilkanPesan(`"${judul}" berhasil ditambahkan.`, "#16a34a");
        renderBuku();
      });

      // [7] Delegation di <form>: input apa pun yang diketik -> hapus tanda error-nya
      form.addEventListener("input", (event) => {
        event.target.classList.remove("salah");
      });

      // [5] input: setiap huruf diketik -> render ulang dengan kata cari baru
      inputCari.addEventListener("input", renderBuku);
      // [5] change: <select> berubah -> render ulang dengan filter baru
      filterStatus.addEventListener("change", renderBuku);

      // [7] Event delegation: 1 listener di <ul> untuk semua kartu & tombolnya.
      //     Kartu dibuat ulang tiap render, tapi listener ini tetap hidup.
      daftar.addEventListener("click", (event) => {
        // [9] closest() naik ke atas sampai ketemu <li>. (tombol.parentElement hanya
        //     menghasilkan div.aksi, bukan <li>, jadi closest() lebih aman.)
        const kartu = event.target.closest("li[data-id]");
        if (!kartu) return;

        const id = Number(kartu.dataset.id); // dataset selalu string -> ubah ke angka
        const tombol = event.target.closest("button[data-aksi]");

        // Klik di bagian kartu selain tombol: pilih / batal pilih
        if (!tombol) {
          idDipilih = idDipilih === id ? null : id;
          renderBuku();
          return;
        }

        // Klik tombol: di sini kita langsung return, jadi kartu tidak ikut terpilih.
        // [6] (Jika memakai listener terpisah per tombol, gunakan event.stopPropagation())
        const aksi = tombol.dataset.aksi;
        if (aksi === "pinjam") {
          const buku = daftarBuku.find((item) => item.id === id);
          buku.dipinjam = !buku.dipinjam; // [10] ubah data
        }
        if (aksi === "hapus") {
          daftarBuku = daftarBuku.filter((item) => item.id !== id); // [10] buang dari data
          if (idDipilih === id) idDipilih = null;
        }
        renderBuku(); // [10] tampilan mengikuti data
      });

      renderBuku();
      console.log("[2] innerText status:", elStatus.innerText);
    </script>
  </body>
</html>
